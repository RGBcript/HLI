[package]
name = "hli-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hli-daemon"
path = "src/main.rs"

[dependencies]
hli-core = { path = "../hli-core" }
hli-store = { path = "../hli-store" }
hli-agent = { path = "../hli-agent" }
hli-provider = { path = "../hli-provider" }
hli-signing = { path = "../hli-signing" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
toml = "0.8"

[features]
# Provider de prueba para el gate de revisión de plan. Nunca se activa en el
# build de producción ni en `dist`.
fixture-provider = []

[dev-dependencies]
hli-module-fixture = { path = "../hli-module-fixture" }
