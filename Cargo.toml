[workspace]
members = [
    "crates/hli-core",
    "crates/hli-store",
    "crates/hli-agent",
    "crates/hli-daemon",
    "crates/hli-cli",
    "crates/hli-mcp",
    "crates/hli-module-memory",
    "crates/hli-module-fixture",
    "crates/hli-provider",
    "crates/hli-tui",
    "crates/hli-signing",
]
resolver = "2"

[workspace.package]
version = "0.9.0-beta.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 2
