[workspace]
members = [
    "crates/hli-core",
    "crates/hli-store",
    "crates/hli-agent",
    "crates/hli-daemon",
    "crates/hli-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 2
